[project]
name = "pixwars-sim"
version = "0.1.0"
description = "PixWars match simulation: the rules only, with no rendering and no networking."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixwars_sim"]
