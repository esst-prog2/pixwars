[project]
name = "pixwars-client"
version = "0.1.0"
description = "PixWars client: a pygame window, a keyboard, and a bot opponent."
requires-python = ">=3.12"
dependencies = [
    "pixwars-sim",
    "pygame-ce>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixwars_client"]

[tool.uv.sources]
pixwars-sim = { workspace = true }
